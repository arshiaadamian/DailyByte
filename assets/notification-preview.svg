  <text x="100" y="63" font-family="Inter" font-size="21" font-weight="600" letter-spacing="1.6" fill="#C6BDAB">DAILYBYTE</text>
  <text x="626" y="63" text-anchor="end" font-family="Inter" font-size="21" font-weight="400" fill="#C6BDAB">now</text>

  <text x="34" y="112" font-family="Inter" font-size="26" font-weight="700" fill="#E1DED3">Why starting at 25 beats starting at 35</text>

  <text x="34" y="148" font-family="Inter" font-size="24" font-weight="400" fill="#C6BDAB">A dollar saved at 25 grows to about seven by</text>
  <text x="34" y="178" font-family="Inter" font-size="24" font-weight="400" fill="#C6BDAB">retirement. At 35 it grows to three. The gap is</text>
  <text x="34" y="208" font-family="Inter" font-size="24" font-weight="400" fill="#C6BDAB">time, not the amount.</text>
</svg>
